<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Cartoons & Dramas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/json;charset=utf-8,{
      %22name%22: %22Kids Cartoons %26 Dramas%22,
      %22short_name%22: %22Kids App%22,
      %22start_url%22: %22/%22,
      %22display%22: %22standalone%22,
      %22background_color%22: %22%230f172a%22,
      %22theme_color%22: %22%23f59e0b%22,
      %22icons%22: [{%22src%22: %22https://cdn-icons-png.flaticon.com/512/3163/3163478.png%22, %22sizes%22: %22512x512%22, %22type%22: %22image/png%22}]
    }">
    <meta name="theme-color" content="#f59e0b">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3163/3163478.png">
</head>
<body class="bg-slate-900 text-white font-sans pb-20">

    <!-- Header -->
    <header class="bg-slate-950 p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center border-b border-amber-500/30">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🎬</span>
            <div>
                <h1 class="text-base font-extrabold text-amber-400 tracking-wide">FunToon & Dramas</h1>
                <p class="text-[10px] text-slate-400">Watch Free Cartoons & Serials</p>
            </div>
        </div>
        <button onclick="toggleAdminModal()" class="bg-amber-500 text-slate-950 px-3 py-1 rounded-full text-xs font-bold shadow hover:bg-amber-400">Admin</button>
    </header>

    <!-- Category Scroll Bar (5 Categories) -->
    <div class="flex gap-2 my-4 px-4 overflow-x-auto pb-2 scrollbar-none">
        <button onclick="filterCategory('Urdu Cartoons')" id="btnUrduCartoons" class="px-4 py-2 rounded-full font-bold bg-amber-500 text-slate-950 text-xs whitespace-nowrap shadow">Urdu Cartoons</button>
        <button onclick="filterCategory('English Cartoons')" id="btnEnglishCartoons" class="px-4 py-2 rounded-full font-bold bg-slate-800 text-slate-300 text-xs whitespace-nowrap">English Cartoons</button>
        <button onclick="filterCategory('Pakistani Dramas')" id="btnPakistaniDramas" class="px-4 py-2 rounded-full font-bold bg-slate-800 text-slate-300 text-xs whitespace-nowrap">Pakistani Dramas</button>
        <button onclick="filterCategory('Hindi Dramas')" id="btnHindiDramas" class="px-4 py-2 rounded-full font-bold bg-slate-800 text-slate-300 text-xs whitespace-nowrap">Hindi Dramas</button>
        <button onclick="filterCategory('Turkey Dramas')" id="btnTurkeyDramas" class="px-4 py-2 rounded-full font-bold bg-slate-800 text-slate-300 text-xs whitespace-nowrap">Turkey Dramas</button>
    </div>

    <!-- Shows Section -->
    <section id="showsContainer" class="px-4 max-w-2xl mx-auto">
        <h2 id="categoryTitle" class="text-sm font-bold text-amber-400 mb-3 uppercase tracking-wider">Urdu Cartoons</h2>
        <div id="showsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <!-- Shows Cards Will Load Here -->
        </div>
    </section>

    <!-- Episode List Modal -->
    <div id="episodesModal" class="fixed inset-0 bg-slate-950/90 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-slate-900 rounded-2xl p-5 w-full max-w-lg max-h-[85vh] overflow-y-auto border border-amber-500/30 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalShowTitle" class="font-extrabold text-lg text-amber-400">Show Episodes</h3>
                <button onclick="closeEpisodesModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
            </div>
            
            <div id="episodesList" class="space-y-2 mb-4">
                <!-- Episodes list here -->
            </div>

            <!-- Admin Add Episode Form Inside Modal -->
            <div id="adminAddEpisodeContainer" class="hidden border-t border-slate-800 pt-4 mt-4">
                <h4 class="text-xs font-bold text-amber-400 mb-2">➕ Add New Episode (Admin)</h4>
                <input type="text" id="epTitle" placeholder="Episode Title (e.g. Episode 1)" class="w-full bg-slate-800 text-white border border-slate-700 p-2 mb-2 rounded text-xs">
                <input type="text" id="epUrl" placeholder="YouTube Link (e.g. https://youtu.be/...)" class="w-full bg-slate-800 text-white border border-slate-700 p-2 mb-2 rounded text-xs">
                <button onclick="uploadEpisode()" class="w-full bg-amber-500 text-slate-950 py-2 rounded text-xs font-bold hover:bg-amber-400">Save Episode</button>
            </div>
        </div>
    </div>

    <!-- Video Player Modal (In-App Player) -->
    <div id="videoPlayerModal" class="fixed inset-0 bg-black hidden flex flex-col justify-center items-center z-[100] p-2">
        <div class="w-full max-w-3xl flex justify-between items-center p-2">
            <span id="playingVideoTitle" class="text-xs font-bold text-amber-400 truncate max-w-[80%]">Playing Video</span>
            <button onclick="closePlayer()" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold">Close ✕</button>
        </div>
        <div class="w-full max-w-3xl aspect-video bg-slate-950 rounded-lg overflow-hidden relative shadow-2xl border border-amber-500/40">
            <iframe id="videoIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Admin Login / Add Show Modal -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/80 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md">
            <h2 class="text-base font-bold mb-4 text-amber-400">Admin Panel</h2>
            <div id="adminLoginForm">
                <input type="email" id="adminEmail" placeholder="Admin Email" class="w-full bg-slate-800 border border-slate-700 p-2 mb-2 rounded text-xs">
                <input type="password" id="adminPassword" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 p-2 mb-4 rounded text-xs">
                <button onclick="loginAdmin()" class="w-full bg-amber-500 text-slate-950 py-2 rounded font-bold text-xs">Login</button>
            </div>
            <div id="adminUploadForm" class="hidden">
                <p class="text-green-400 font-semibold mb-3 text-xs">✓ Logged in as Admin</p>
                <input type="text" id="sTitle" placeholder="Show / Cartoon Title" class="w-full bg-slate-800 border border-slate-700 p-2 mb-2 rounded text-xs">
                <select id="sCategory" class="w-full bg-slate-800 border border-slate-700 p-2 mb-2 rounded text-xs">
                    <option value="Urdu Cartoons">Urdu Cartoons</option>
                    <option value="English Cartoons">English Cartoons</option>
                    <option value="Pakistani Dramas">Pakistani Dramas</option>
                    <option value="Hindi Dramas">Hindi Dramas</option>
                    <option value="Turkey Dramas">Turkey Dramas</option>
                </select>
                <input type="text" id="sThumb" placeholder="Thumbnail Image URL" class="w-full bg-slate-800 border border-slate-700 p-2 mb-2 rounded text-xs">
                <textarea id="sDesc" placeholder="Description" class="w-full bg-slate-800 border border-slate-700 p-2 mb-3 rounded text-xs"></textarea>
                
                <button onclick="uploadShow()" class="w-full bg-amber-500 text-slate-950 py-2 rounded font-bold text-xs mb-2">Publish Show</button>
                <button onclick="logoutAdmin()" class="w-full bg-slate-700 text-white py-2 rounded font-bold text-xs">Logout</button>
            </div>
            <button onclick="toggleAdminModal()" class="w-full mt-3 text-slate-400 text-xs">Close</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://itioklvniyrwofnsivtn.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0aW9rbHZuaXlyd29mbnNpdnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MjQ3MTQsImV4cCI6MjEwNzQwMDcxNH0.a7YY-avfVf9eq8GDjs3SVFe0LyPJ2bQWCZFAGlWCBW4";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'Urdu Cartoons';
        let currentShowId = null;
        let isAdminLoggedIn = false;

        const categories = ['Urdu Cartoons', 'English Cartoons', 'Pakistani Dramas', 'Hindi Dramas', 'Turkey Dramas'];

        function filterCategory(cat) {
            currentCategory = cat;
            document.getElementById('categoryTitle').innerText = cat;
            categories.forEach(c => {
                const btnId = 'btn' + c.replace(/\s+/g, '');
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(c === cat) {
                        btn.className = "px-4 py-2 rounded-full font-bold bg-amber-500 text-slate-950 text-xs whitespace-nowrap shadow";
                    } else {
                        btn.className = "px-4 py-2 rounded-full font-bold bg-slate-800 text-slate-300 text-xs whitespace-nowrap";
                    }
                }
            });
            loadShows();
        }

        function toggleAdminModal() {
            document.getElementById('adminModal').classList.toggle('hidden');
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login Failed: ' + error.message);
            } else {
                isAdminLoggedIn = true;
                alert('Login Successful!');
                document.getElementById('adminLoginForm').classList.add('hidden');
                document.getElementById('adminUploadForm').classList.remove('hidden');
                loadShows();
            }
        }

        async function logoutAdmin() {
            await supabaseClient.auth.signOut();
            isAdminLoggedIn = false;
            document.getElementById('adminLoginForm').classList.remove('hidden');
            document.getElementById('adminUploadForm').classList.add('hidden');
            alert('Logged out');
            loadShows();
        }

        async function loadShows() {
            const grid = document.getElementById('showsGrid');
            grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-10 text-xs">Loading Shows...</p>';

            const { data, error } = await supabaseClient
                .from('shows')
                .select('*')
                .eq('category', currentCategory)
                .order('id', { ascending: false });

            if (error) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-400 text-xs">Error loading content.</p>';
                return;
            }

            if (data.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-10 text-xs">No shows found in this category.</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(s => {
                const thumb = s.thumbnail || 'https://via.placeholder.com/300x400?text=No+Image';
                let deleteBtn = isAdminLoggedIn ? `<button onclick="deleteShow(${s.id})" class="mt-2 w-full bg-red-600/80 text-white py-1 rounded text-[10px] font-bold">🗑️ Delete</button>` : '';

                grid.innerHTML += `
                    <div class="bg-slate-800/80 rounded-xl overflow-hidden border border-slate-700/60 shadow flex flex-col justify-between">
                        <div onclick="openEpisodesModal(${s.id}, '${s.title}')" class="cursor-pointer group">
                            <div class="relative overflow-hidden aspect-[3/4]">
                                <img src="${thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent"></div>
                                <span class="absolute bottom-2 left-2 text-xs font-extrabold text-amber-400">► Watch</span>
                            </div>
                            <div class="p-2">
                                <h3 class="font-bold text-xs text-slate-100 truncate">${s.title}</h3>
                                <p class="text-[10px] text-slate-400 line-clamp-1">${s.description || ''}</p>
                            </div>
                        </div>
                        <div class="p-2 pt-0">
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });
        }

        async function uploadShow() {
            const title = document.getElementById('sTitle').value;
            const category = document.getElementById('sCategory').value;
            const thumbnail = document.getElementById('sThumb').value;
            const description = document.getElementById('sDesc').value;

            if (!title) { alert('Title is required'); return; }

            const { error } = await supabaseClient.from('shows').insert([
                { title, category, thumbnail, description }
            ]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Show added successfully!');
                document.getElementById('sTitle').value = '';
                document.getElementById('sThumb').value = '';
                document.getElementById('sDesc').value = '';
                toggleAdminModal();
                loadShows();
            }
        }

        async function openEpisodesModal(showId, showTitle) {
            currentShowId = showId;
            document.getElementById('modalShowTitle').innerText = showTitle;
            document.getElementById('episodesModal').classList.remove('hidden');

            if (isAdminLoggedIn) {
                document.getElementById('adminAddEpisodeContainer').classList.remove('hidden');
            } else {
                document.getElementById('adminAddEpisodeContainer').classList.add('hidden');
            }

            loadEpisodes(showId);
        }

        function closeEpisodesModal() {
            document.getElementById('episodesModal').classList.add('hidden');
        }

        async function loadEpisodes(showId) {
            const list = document.getElementById('episodesList');
            list.innerHTML = '<p class="text-center text-slate-500 py-4 text-xs">Loading episodes...</p>';

            const { data, error } = await supabaseClient
                .from('episodes')
                .select('*')
                .eq('show_id', showId)
                .order('id', { ascending: true });

            if (error || !data || data.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-500 py-4 text-xs">No episodes added yet.</p>';
                return;
            }

            list.innerHTML = '';
            data.forEach((ep, idx) => {
                let delBtn = isAdminLoggedIn ? `<button onclick="deleteEpisode(${ep.id})" class="text-red-400 text-xs ml-2">🗑️</button>` : '';
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-800/90 p-3 rounded-lg border border-slate-700/50">
                        <span class="text-xs font-bold text-slate-200">EP ${idx + 1}: ${ep.episode_title}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="playVideo('${ep.video_url}', '${ep.episode_title}')" class="bg-amber-500 text-slate-950 px-3 py-1 rounded text-xs font-bold hover:bg-amber-400">► Play</button>
                            ${delBtn}
                        </div>
                    </div>
                `;
            });
        }

        async function uploadEpisode() {
            const title = document.getElementById('epTitle').value;
            let url = document.getElementById('epUrl').value.trim();

            if (!title || !url) { alert('Sare fields bhariye!'); return; }

            // Automatic YouTube URL to Embed Convertor
            let videoId = '';
            if (url.includes('v=')) {
                videoId = url.split('v=')[1].split('&')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1].split('?')[0];
            }

            if (videoId) {
                url = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
            }

            const { error } = await supabaseClient.from('episodes').insert([
                { show_id: currentShowId, episode_title: title, video_url: url }
            ]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Episode add ho gaya!');
                document.getElementById('epTitle').value = '';
                document.getElementById('epUrl').value = '';
                loadEpisodes(currentShowId);
            }
        }

        function playVideo(url, title) {
            document.getElementById('playingVideoTitle').innerText = title;
            document.getElementById('videoIframe').src = url;
            document.getElementById('videoPlayerModal').classList.remove('hidden');
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('videoPlayerModal').classList.add('hidden');
        }

        async function deleteShow(id) {
            if (confirm('Delete this show?')) {
                await supabaseClient.from('shows').delete().eq('id', id);
                loadShows();
            }
        }

        async function deleteEpisode(id) {
            if (confirm('Delete episode?')) {
                await supabaseClient.from('episodes').delete().eq('id', id);
                loadEpisodes(currentShowId);
            }
        }

        loadShows();
    </script>
</body>
</html>
